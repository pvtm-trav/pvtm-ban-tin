name: Kiểm tra và đóng gói bản tin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python build.py --include-drafts
      - uses: actions/upload-artifact@v4
        with:
          name: ban-tin-xem-truoc
          path: public/
          retention-days: 14
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse deploy scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem deploy/*.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Exercise deployment and rollback in isolated TEMP directories
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -File deploy/Test-Update-BanTin.ps1
  preview-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, powershell-syntax]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python build.py --include-drafts
      - run: python deploy/package.py --channel preview --commit "$GITHUB_SHA" --tag "preview-$GITHUB_SHA"
      - name: Publish preview prerelease once per commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "preview-$GITHUB_SHA" >/dev/null 2>&1; then
            gh release create "preview-$GITHUB_SHA" release-output/bantin-site.zip release-output/release.json --prerelease --target "$GITHUB_SHA" --title "Preview $GITHUB_SHA" --notes 'For /ban-tin-moi/ only. Not approved for the main website.'
          fi
