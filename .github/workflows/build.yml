name: Kiểm tra và đóng gói bản tin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python build.py --include-drafts
      - uses: actions/upload-artifact@v4
        with:
          name: ban-tin-xem-truoc
          path: public/
          retention-days: 14
