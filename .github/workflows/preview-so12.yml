name: Prepare issue 12 isolated Preview
on:
  push:
    branches: ['preview/so-12-2026']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python build.py --include-drafts
      - name: Verify issue 12 against Word extraction
        run: python validation/check-so-12.py
      - name: Isolate issue 12 and preserve the preview catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json,os
          src=Path('public'); dst=Path('preview12'); dst.mkdir()
          shutil.copy2(src/'so-12-2026.html',dst/'so-12-2026.html')
          shutil.copy2('deploy/previews/so-12-index.html',dst/'index.html')
          shutil.copytree(src/'assets/issues/so-12-2026',dst/'assets/issues/so-12-2026')
          (dst/'assets/fonts').mkdir(parents=True,exist_ok=True)
          shutil.copy2(src/'assets/fonts/Anton.ttf',dst/'assets/fonts/Anton.ttf')
          (dst/'assets/fonts').mkdir(parents=True,exist_ok=True)
          shutil.copy2(src/'assets/fonts/Anton.ttf',dst/'assets/fonts/Anton.ttf')
          for f in ['asset-02.jpg','asset-06.png']:
              shutil.copy2(src/'assets'/f,dst/'assets'/f)
          (dst/'so-12-preview-version.json').write_text(json.dumps({'issue_id':'so-12-2026','commit':os.environ['GITHUB_SHA'],'channel':'preview'}))
          shutil.copy2('validation/so-12-review.md',dst/'so-12-review.txt')
          PY
      - name: Package Preview
        run: python deploy/package.py --source preview12 --channel preview --commit "$GITHUB_SHA" --tag "preview-$GITHUB_SHA"
      - name: Publish Preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-$GITHUB_SHA" release-output/bantin-site.zip release-output/release.json --prerelease --target "$GITHUB_SHA" --title "Issue 12 Preview $GITHUB_SHA" --notes "Isolated issue 12. Not approved for Production. See so-12-review.txt."
