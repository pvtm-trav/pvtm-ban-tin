name: Publish approved BanTin
on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: 'Approved issue ID, e.g. so-21-2026'
        required: true
      approved_commit:
        description: 'Full 40-character commit SHA reviewed at /ban-tin-moi/'
        required: true
      approved:
        description: 'I approve this issue at exactly this commit for the main website'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    if: inputs.approved
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify approval pins current main commit and published issue
        env:
          ISSUE_ID: ${{ inputs.issue_id }}
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert re.fullmatch(r'[a-f0-9]{40}',os.environ['APPROVED_COMMIT'])
          assert sha == os.environ['APPROVED_COMMIT'], 'Main changed after review: inspect preview again.'
          issue_id=os.environ['ISSUE_ID']
          assert re.fullmatch(r'so-[0-9]+-[0-9]{4}',issue_id)
          issue=json.loads((pathlib.Path('content/issues')/(issue_id+'.json')).read_text())
          assert issue['id']==issue_id and issue['status']=='published'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'RELEASE_TAG=bantin-{issue["year"]}.{issue["number"]}-{sha[:12]}\n')
          PY
      - run: python build.py
      - name: Package approved commit
        run: python deploy/package.py --channel production --commit "$GITHUB_SHA" --tag "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-output/bantin-site.zip release-output/release.json --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "Approved ${{ inputs.issue_id }} at commit $GITHUB_SHA. IIS production agent polls this release."
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem deploy/*.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count) { throw ($errors | Out-String) }
          }
